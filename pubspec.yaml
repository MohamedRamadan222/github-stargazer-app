name: stargazer_app
description: "Explore GitHub repositories and developers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  go_router: ^18.1.1
  fpdart: ^1.2.0
  equatable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  cached_network_image: ^4.0.5
  flutter_markdown_plus: ^1.0.12
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  # نقلنا الـ build_runner هنا وظبطنا الإصدارات عشان تشتغل مع hive_ce
  build_runner: any
  hive_ce_generator: any

flutter:
  uses-material-design: true
  assets:
    - .env

